# Alert rules for sseredis (see "Monitoring" in README.md), in Prometheus' rule-file format: import them into
# Grafana (Alerting > Alert rules > Import alert rules, source a Prometheus YAML file, pick the Prometheus data
# source), or load them in Prometheus itself (rule_files).
#
# If your scrape job isn't called "sseredis", set its name first:
#
#   sed 's/job="sseredis"/job="<job>"/' grafana/alerts.yaml > sseredis-alerts.yaml
#
# Each rule fires for every series its expression returns. Grafana imports them with "no data" and "error" as
# OK, so SseredisDown also fires without any target (absent()).
groups:
  - name: sseredis
    interval: 1m
    rules:
      - alert: SseredisDown
        # Also when there is no target at all: the scrape config is gone.
        expr: up{job="sseredis"} < 1 or absent(up{job="sseredis"})
        for: 2m
        labels: {service: sseredis, severity: critical}
        annotations:
          summary: '{{ with $labels.instance }}sseredis {{ . }} cannot be scraped{{ else }}Prometheus scrapes no sseredis{{ end }}'
          description: >-
            Prometheus has not reached the sseredis metrics for 2 minutes: sseredis is down, or nginx
            (or its allow rule) blocks the scrape. Live updates are probably down.

      - alert: SseredisRedisDisconnected
        expr: sseredis_redis_connected{job="sseredis"} < 1
        for: 1m                     # no data: SseredisDown says it
        labels: {service: sseredis, severity: critical}
        annotations:
          summary: 'sseredis {{ $labels.instance }} is not connected to Redis'
          description: >-
            sseredis has been disconnected from Redis for over a minute: no live update is delivered.
            It keeps reconnecting (backoff up to 30s); check that Redis is running and reachable.

      - alert: SseredisRedisFlapping
        expr: increase(sseredis_redis_connects_total{job="sseredis", result="ok"}[15m]) > 3
        for: 0s
        labels: {service: sseredis, severity: warning}
        annotations:
          summary: 'sseredis {{ $labels.instance }} keeps reconnecting to Redis'
          description: >-
            {{ printf "%.0f" $value }} Redis connections in 15 minutes. Messages published while
            disconnected are lost.

      - alert: SseredisAuthErrors
        # The share of authentications that fail (refused sessions are not failures); only with authentications
        # (no 0/0).
        expr: >-
          (
            sum by (instance) (rate(sseredis_connections_total{job="sseredis", result="auth_error"}[5m]))
            / sum by (instance) (rate(sseredis_connections_total{job="sseredis", result=~"ok|refused|auth_error"}[5m]))
            and sum by (instance) (rate(sseredis_connections_total{job="sseredis", result=~"ok|refused|auth_error"}[5m])) > 0
          ) > 0.05
        for: 5m
        labels: {service: sseredis, severity: critical}
        annotations:
          summary: 'sseredis {{ $labels.instance }}: {{ humanizePercentage $value }} of authentications fail'
          description: >-
            The Django authenticator API is down, times out or answers 5xx, so users cannot open live
            updates. (Refused sessions are not counted.)

      - alert: SseredisAuthSlow
        # p95 of the authentication time; only with authentications (no NaN).
        expr: >-
          (
            histogram_quantile(0.95, sum by (instance, le) (rate(sseredis_auth_duration_seconds_bucket{job="sseredis"}[5m])))
            and sum by (instance) (rate(sseredis_auth_duration_seconds_count{job="sseredis"}[5m])) > 0
          ) > 1
        for: 10m
        labels: {service: sseredis, severity: warning}
        annotations:
          summary: 'sseredis {{ $labels.instance }}: authentication p95 is {{ humanizeDuration $value }}'
          description: >-
            The Django authenticator API is slow; at -auth-timeout (5s by default) connections fail.

      - alert: SseredisDroppingClients
        expr: increase(sseredis_clients_dropped_total{job="sseredis"}[15m]) > 10
        for: 0s
        labels: {service: sseredis, severity: warning}
        annotations:
          summary: 'sseredis {{ $labels.instance }} dropped {{ printf "%.0f" $value }} slow clients in 15 minutes'
          description: >-
            Clients do not read their stream fast enough (their queue of 64 messages filled up). A few
            are normal (bad mobile networks); many point to a proxy buffering the stream, or to bursts
            of messages too large for the clients.
