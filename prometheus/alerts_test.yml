# Unit tests for alerts.yml: promtool test rules prometheus/alerts_test.yml

rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  - name: Redis disconnected fires after a minute, and only then
    interval: 1m
    input_series:
      - series: 'sseredis_redis_connected{job="sseredis", instance="a"}'
        values: "1 1 0 0 0 0"
    alert_rule_test:
      - eval_time: 2m
        alertname: SseredisRedisDisconnected
        exp_alerts: []
      - eval_time: 4m
        alertname: SseredisRedisDisconnected
        exp_alerts:
          - exp_labels: {severity: critical, job: sseredis, instance: a}
            exp_annotations:
              summary: "sseredis a is not connected to Redis"
              description: >-
                sseredis has been disconnected from Redis for over a minute: no live update is delivered.
                It keeps reconnecting (backoff up to 30s); check that Redis is running and reachable.

  - name: Auth errors above 5% fire, refusals do not count
    interval: 1m
    input_series:
      # 10 connections a minute: 8 ok, 1 refused, 1 error (10%).
      - series: 'sseredis_connections_total{job="sseredis", instance="a", result="ok"}'
        values: "0+8x20"
      - series: 'sseredis_connections_total{job="sseredis", instance="a", result="refused"}'
        values: "0+1x20"
      - series: 'sseredis_connections_total{job="sseredis", instance="a", result="auth_error"}'
        values: "0+1x20"
      # Refusals only: no alert.
      - series: 'sseredis_connections_total{job="sseredis", instance="b", result="ok"}'
        values: "0+5x20"
      - series: 'sseredis_connections_total{job="sseredis", instance="b", result="refused"}'
        values: "0+5x20"
      - series: 'sseredis_connections_total{job="sseredis", instance="b", result="auth_error"}'
        values: "0x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: SseredisAuthErrors
        exp_alerts:
          - exp_labels: {severity: critical, instance: a}
            exp_annotations:
              summary: "sseredis a: 10% of authentications fail"
              description: >-
                The Django authenticator API is down, times out or answers 5xx, so users cannot open live
                updates. (Refused sessions are not counted.)

  - name: Slow authentication
    interval: 1m
    input_series:
      # Every authentication takes between 1 and 2.5s.
      - series: 'sseredis_auth_duration_seconds_bucket{job="sseredis", instance="a", result="ok", le="1"}'
        values: "0x30"
      - series: 'sseredis_auth_duration_seconds_bucket{job="sseredis", instance="a", result="ok", le="2.5"}'
        values: "0+10x30"
      - series: 'sseredis_auth_duration_seconds_bucket{job="sseredis", instance="a", result="ok", le="+Inf"}'
        values: "0+10x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: SseredisAuthSlow
        exp_alerts:
          - exp_labels: {severity: warning, instance: a}
            exp_annotations:
              summary: "sseredis a: authentication p95 is 2.425s"
              description: >-
                The Django authenticator API is slow; at -auth-timeout (5s by default) connections fail.

  - name: Dropping clients
    interval: 1m
    input_series:
      - series: 'sseredis_clients_dropped_total{job="sseredis", instance="a"}'
        values: "0+1x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: SseredisDroppingClients
        exp_alerts:
          - exp_labels: {severity: warning, job: sseredis, instance: a}
            exp_annotations:
              summary: "sseredis a dropped 15 slow clients in 15 minutes"
              description: >-
                Clients do not read their stream fast enough (their queue of 64 messages filled up). A few
                are normal (bad mobile networks); many point to a proxy buffering the stream, or to bursts
                of messages too large for the clients.
